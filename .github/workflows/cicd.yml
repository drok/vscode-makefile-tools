name: Build and Deploy

on:
  push:
    branches:
      - "pre/*"
      - wip/arm64-cross
  pull_request:
    branches:
      - master
  release:
    types:
      - published

jobs:
  build-lint-test:
    name: Node ${{ matrix.node }} on ${{ matrix.config.os }}-${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-20.04, name: linux }
          # See https://github.blog/2023-10-02-introducing-the-new-apple-silicon-powered-m1-macos-larger-runner-for-github-actions/
          - { os: macos-latest, name: darwin }
          # - { os: macos-12-large, name: darwin-x64 }
          # - { os: macos-13-xlarge, name: darwin-arm64 }
          # - { os: windows-latest, name: win32 }
        node:
          - 18
    outputs:
      vsixPath: ${{ steps.packageExtension.outputs.vsixPath }}
      target: ${{ matrix.config.name }}
    steps:
      - name: Enable arm64 architecture
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get reinstall pkg-config
          # Ubuntu bug causes pkg-config be created as "gnu" instead of "gnueabi". Fix this up.
          # sudo mv /usr/bin/arm-linux-gnu{,eabi}-pkg-config
        if: runner.os == 'Linux'

      - name: Install cross compilers/tools
        run: sudo apt-get install gcc-aarch64-linux-gnu
          libc6-dev-arm64-cross
          autopoint
          libbsd-resource-perl
        if: runner.os == 'Linux'

      - name: Update homebrew
        run: |
          brew install automake
        if: runner.os == 'macOS'
      - name: Update msys
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            autoconf automake libtool gettext
        if: runner.os == 'Windows'
      - name: Setup GIT for Windows
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
        if: runner.os == 'Windows'
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Cache Yarn packages
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v3
        id: yarn-cache # use this to check for `cache-hit` (`steps.yarn-cache.outputs.cache-hit != 'true'`)
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install Dependencies
        run: yarn install
      # - name: Run Linter
      #   run: npm run lint
      - name: Bootstrap external dependencies
        run: |
            cd vendor/gnumake && [ -f configure ] || autoreconf -fvi


      - id: package-linux-x64
        name: Package for linux-x64
        uses: ./.github/actions/native-build
        with:
          cpu: x64
          platform: ${{ matrix.config.name }}
          host: x86_64-pc-linux-gnu
        if: runner.os == 'Linux'

      - id: package-linux-arm64
        name: Package for linux-arm64
        uses: ./.github/actions/native-build
        with:
          cpu: arm64
          platform: ${{ matrix.config.name }}
          host: aarch64-linux-gnu
        if: runner.os == 'Linux'

      - id: package-darwin-x64
        name: Package for darwin-x64
        uses: ./.github/actions/native-build
        with:
          cpu: x64
          platform: ${{ matrix.config.name }}
          host: x86_64-apple-darwin21.6.0
        if: runner.os == 'macOS'

      - id: package-darwin-arm64
        name: Package for darwin-arm64
        uses: ./.github/actions/native-build
        with:
          cpu: arm64
          platform: ${{ matrix.config.name }}
          host: aarch64-apple-darwin21.6.0
        if: runner.os == 'macOS'

      # - name: Run Unit Tests on Windows or macOS
      #   run: npm run test
      #   if: runner.os != 'Linux'
      # - name: Run Unit Tests on Linux
      #   run: xvfb-run -a npm test
      #   if: runner.os == 'Linux'
      # - name: Upload Coverage Report
      #   uses: coverallsapp/github-action@1.1.3
      #   with:
      #     github-token: ${{ secrets.GITHUB_TOKEN }}
      #     parallel: true
      #     flag-name: Test on ${{ matrix.config.os }}

  # coverage:
  #   name: Code Coverage
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 10
  #   needs: build-lint-test
  #   steps:
  #     - name: Let Coveralls know that all tests have finished
  #       uses: coverallsapp/github-action@1.1.3
  #       with:
  #         github-token: ${{ secrets.GITHUB_TOKEN }}
  #         parallel-finished: true

  publish:
    name: Publish Github Action
    needs:
      - build-lint-test
      # - coverage
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # - name: Checkout Source
      #   uses: actions/checkout@v4
      # - name: Install Node v16
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: 16
      # - name: Install Dependencies
      #   run: npm ci
      - name: Download Build Artifact
        id: download
        uses: actions/download-artifact@v3
      - name: 'Echo download path'
        run:
          echo downloaded... ${{steps.download.outputs.download-path}}
          echo expected... ${{ needs.build-lint-test.outputs.target }}/${{ needs.build-lint-test.outputs.vsixPath }}
      - name: GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: false
          body: |
            # Summary
            See [changelog](https://github.com/...path.to.changelog#changelog)
          name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: ${{ needs.build-lint-test.outputs.target }}/${{ needs.build-lint-test.outputs.vsixPath }}
      - name: Publish to Visual Studio Marketplace
        uses: HaaLeo/publish-vscode-extension@v1
        with:
          pat: ${{ secrets.VS_MARKETPLACE_TOKEN }}
          extensionFile: ${{ needs.build-lint-test.outputs.target }}/${{ needs.build-lint-test.outputs.vsixPath }}
          registryUrl: https://marketplace.visualstudio.com
          target: ${{ needs.build-lint-test.outputs.target }}
      #- name: Publish to Open VSX Registry
      #  uses: HaaLeo/publish-vscode-extension@v1
      #  with:
      #    pat: ${{ secrets.OPEN_VSX_TOKEN }}
      #    extensionFile: ${{ needs.build-lint-test.outputs.vsixPath }}
      #    target: ${{ needs.build-lint-test.outputs.target }}
