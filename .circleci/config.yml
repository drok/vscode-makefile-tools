version: 2.1

commands:
  checkout-and-build:
    description: Check out and build the project, persist the visx file
    parameters:
      target:
          type: string

    steps:
      - checkout
      - run: git submodule update --depth 1 --init

      - run:
          name: Update Node.js and other dependencies
          command: |
            set
            case "$CIRCLE_JOB" in
              build-linux-*)
                  DISTRIBUTOR=$(lsb_release -si)
                  case $DISTRIBUTOR in
                    Ubuntu)
                        sudo apt-get update && sudo apt-get install -y autopoint libbsd-resource-perl
                        ;;
                    *)
                        >&2 echo "Distributor $DISTRIBUTOR not yet supported... fix .circleci/config.yml"
                        false # not supported
                        ;;
                  esac
                  objdump -T /lib/*/libc.so.6 | egrep 'memcpy|clock_gettime|__libc_start_main|glob|__xstat|lstat'
                  ;;
              build-macos-x86)
                  brew install automake
                  ;;
              *)
                  >&2 echo "CIRCLE_JOB $CIRCLE_JOB not yet supported... fix .circleci/config.yml"
                  false # not supported
                  ;;
            esac
      - run:
          name: Install Dependencies
          command: yarn install
      - run:
          name: Detect Binary Build Info
          command: node -e 'let e={arch:process.arch,platform:process.platform};console.log(`export let buildinfo:{arch:string,platform:string}=${JSON.stringify(e)};`);' > buildinfo.ts
      - run:
          name: Generate Translations
          command: yarn run translations-generate
      - run:
          name: Bootstrap external dependencies
          command: |
            cd vendor/gnumake && [ -f configure ] || autoreconf -fvi
            cd utils/ad7proxy && [ -f configure ] || autoreconf -fvi
      - run:
          name: Configure make externals
          command: |
            if [[ "$OSTYPE" != "linux-gnu" ]]; then
              yarn configure
            else
              mkdir -p build/make && cd build/make && [ -f config.status ] ||
              make_cv_sys_gnu_glob=yes \
              ac_cv_func_gettimeofday=no \
              ac_cv_search_clock_gettime=no \
              ../../vendor/gnumake/configure -C \
                --disable-dependency-tracking \
                --with-guile=no \
                --disable-job-server \
                --disable-load \
                "CFLAGS=-g0 -O2 -include $PWD/../../vendor/gnumake-include.h" \
                LDFLAGS=-lrt \
                --disable-nls \
                --prefix=$PWD/../..
            fi
      - run:
          name: Configure ad7proxy externals
          command: |
            if [[ "$OSTYPE" != "linux-gnu" ]]; then
              yarn configure
            else
              mkdir -p build/ad7proxy && cd build/ad7proxy && [ -f config.status ] ||
              ../../vendor/gnumake/configure -C \
                --disable-dependency-tracking \
                "CFLAGS=-g0 -O2" \
                --prefix=$PWD/../..
            fi
      - run:
          name: Build Binaries
          command: |
            make -C build/make install-strip
            make -C build/ad7proxy install-strip
      - run:
          name: Build Extension
          command: yarn production-compile
      - run:
          name: Check make symbols
          command: objdump -T bin/make
      - run:
          name: Package Extension
          command: |
            TARGET=<< parameters.target >> npm run package
            PACKAGE_STRING=$(jq -r '"\(.name)-\(.version)"' package.json)-pre
            echo "export PACKAGE_STRING=\"$PACKAGE_STRING\"" >> $BASH_ENV
            cat $BASH_ENV
            pwd
            ls -la
# fake for testing      - run:
# fake for testing          name: fake output gen
# fake for testing          command: |
# fake for testing            mkdir packaged
# fake for testing            echo source > source.js
# fake for testing            echo output file > packaged/autotools.0.2.0-pre-linux-x64.vsix
# fake for testing            echo output file 2 > autotools.0.2.0-pre-linux-x64.vsix2
# fake for testing            pwd
# fake for testing            find . -ls
# fake for testing            echo "export PACKAGE_STRING=\"autotools.0.2.0-pre\"" >> $BASH_ENV
# fake for testing
      - persist_to_workspace:
          root: .
          paths:
            - packaged

      - store_artifacts:
          path: packaged

# parameters:
#   target:
#     type: string
#     default: linux-x64
#     description: "TARGET name in node notation"
#   image:
#     type: string
#     default: ubuntu-20.04
#     description: "Distro to compile on"

jobs:
  build-linux-x64:

    machine:
      image: ubuntu-2004:current
    resource_class: medium
    steps:
      - checkout-and-build:
          target: linux-x64

  build-linux-arm64:

    machine:
      image: ubuntu-2004:current
    resource_class: arm.medium
    steps:
      - checkout-and-build:
          target: linux-arm64

  # Deprecated June 2024
  # This generates 32-bit - use GitHub to gen x86_64
  build-macos-x86:

    macos:
      xcode: 14.2.0
    resource_class: macos.x86.medium.gen2
    steps:
      - checkout-and-build:
          target: darwin-x64

#  Available May 2024
#  build-macos-arm64:
#
#    macos:
#      xcode: 14.2.0
#    resource_class: macos.m1.medium.gen1
#    steps:
#      - checkout-and-build:
#          target: darwin-arm64

  check-persisted:
    docker:
      - image: alpine:latest
    steps:
        - attach_workspace:
            at: .
        - run:
            name: Examine persisted
            command: |
                pwd
                find .

  publish:
    docker:
      - image: cimg/node:18.20
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Publish to Visual Studio Marketplace
          command: vsce publish --pre-release --yarn -i packaged/*.visx

workflows:
